apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-api
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-api
  template:
    metadata:
      labels:
        app: products-api
    spec:
      containers:
        - name: products-api
          image: ecommerce-products-api:aks-v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: MYSQL_HOST
              value: mysql.ecommerce-data.svc.cluster.local
            - name: MYSQL_USER
              value: ecommerce
            - name: MYSQL_PASSWORD
              value: admin
            - name: ConnectionStrings__Redis
              value: redis.ecommerce-data.svc.cluster.local:6379
            - name: RabbitMQ__HostName
              value: rabbitmq.ecommerce-data.svc.cluster.local
            - name: RabbitMQ__Port
              value: "5672"
            - name: RabbitMQ__UserName
              value: guest
            - name: RabbitMQ__Password
              value: guest
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: products-api
  namespace: ecommerce
spec:
  selector:
    app: products-api
  ports:
    - port: 80
      targetPort: 8080
