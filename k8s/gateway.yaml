apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ecommerce-api-gateway:aks-v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Aks
            # CORS passa a ser do APIM; uma origem inexistente faz o Ocelot não emitir cabeçalhos CORS.
            # (O frontend do AKS é servido pelo mesmo Ingress, mesma origem, então não precisa de CORS.)
            - name: Cors__Origins
              value: https://cors-handled-by-apim.invalid
            # Segredo que o APIM injeta em X-Apim-Secret (docs/roteiro-entra-external-id-apim.md, D3).
            # optional: sem o Secret o gateway segue aberto, como antes.
            - name: Apim__SharedSecret
              valueFrom:
                secretKeyRef:
                  name: apim-gateway
                  key: shared-secret
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ecommerce
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8080